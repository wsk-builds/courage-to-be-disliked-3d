<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Courage to Be Disliked · Spectator World</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="loading">
    <div class="loading-inner">
      <div class="title-jp">嫌われる勇気</div>
      <div class="title-cn" id="loading-title">The Courage to Be Disliked</div>
      <div class="subtitle" id="loading-subtitle">An interactive Adlerian world you can watch</div>
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <div class="loading-hint" id="loading-hint">Building the study and the night…</div>
      <div class="loading-error" id="loading-error" hidden></div>
    </div>
  </div>

  <div id="ui" class="hidden">
    <header id="top-bar">
      <div class="brand">
        <span class="brand-mark">◎</span>
        <span id="brand-part">The Courage to Be Disliked</span>
      </div>
      <div class="top-right">
        <div class="lang-switch" id="lang-switch" title="Language / 语言 (L)">
          <button type="button" id="btn-lang-en" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" id="btn-lang-zh" class="lang-btn" data-lang="zh">中文</button>
        </div>
        <div class="voice-panel" id="voice-panel">
          <button type="button" id="btn-voice" class="voice-btn" aria-pressed="true">🔊 Voice</button>
          <button type="button" id="btn-cast" class="voice-btn" title="Cast voices (V)">🎙 Cast</button>
          <input type="range" id="voice-volume" min="0" max="100" value="100" aria-label="Volume" />
        </div>
        <button type="button" id="btn-help" class="icon-btn" title="Controls (H)" aria-expanded="false">?</button>
      </div>
    </header>

    <div id="cast-panel" class="cast-panel" hidden>
      <div class="cast-head">
        <div>
          <div class="cast-title" id="cast-title">Voice casting</div>
          <div class="cast-sub" id="cast-status">Browser system voices · preview and save</div>
        </div>
        <button type="button" id="cast-close" class="nav-collapse" title="Close">×</button>
      </div>
      <p class="cast-tip" id="cast-tip"></p>
      <div id="cast-rows" class="cast-rows"></div>
      <div class="cast-actions">
        <button type="button" id="cast-refresh" class="cast-action">Refresh voice list</button>
        <button type="button" id="cast-reset" class="cast-action ghost">Reset to auto</button>
      </div>
    </div>

    <aside id="story-nav" class="story-nav" aria-label="Story menu">
      <button type="button" id="nav-toggle" class="nav-toggle" title="Menu (C)">
        <span class="nav-toggle-icon">☰</span>
        <span class="nav-toggle-label" id="nav-toggle-label">Menu</span>
      </button>
      <div class="nav-panel">
        <div class="nav-head">
          <span class="nav-title" id="nav-title">Story menu</span>
          <button type="button" id="nav-collapse" class="nav-collapse" title="Collapse">‹</button>
        </div>
        <div class="nav-section">
          <div class="nav-section-label" id="nav-parts-label">Chapters</div>
          <div id="part-rail" class="nav-list" role="listbox" aria-label="Chapters"></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-label" id="nav-segs-label">Scenes</div>
          <div id="chapter-rail" class="nav-list" role="listbox" aria-label="Scenes"></div>
        </div>
        <p class="nav-hint" id="nav-hint"></p>
      </div>
    </aside>

    <div id="help-panel" class="help-panel" hidden>
      <div class="help-title" id="help-title">Controls</div>
      <ul class="help-list" id="help-list"></ul>
    </div>

    <div id="voice-gate" class="voice-gate" role="status" aria-live="polite">
      <button type="button" id="voice-gate-btn" class="voice-gate-btn">
        <span class="voice-gate-icon" aria-hidden="true">🔊</span>
        <span id="voice-gate-label">Click anywhere to enable voice</span>
      </button>
    </div>

    <div id="dialogue-panel">
      <div id="speaker" class="speaker"></div>
      <div id="dialogue-text" class="dialogue-text"></div>
      <div id="dialogue-progress">
        <div id="dialogue-progress-fill"></div>
      </div>
    </div>

    <div id="story-controls">
      <button id="btn-prev" title="Previous">‹</button>
      <button id="btn-play" title="Play / pause">▶</button>
      <button id="btn-next" title="Next">›</button>
      <span id="line-counter">0 / 0</span>
    </div>

    <div id="minimap-label">Ancient city · outskirts</div>

    <footer id="footer-note"></footer>
  </div>

  <canvas id="c"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
